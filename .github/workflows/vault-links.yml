name: Vault links

on:
  pull_request:
    paths:
      - "Docs/Palfrey Docs/**"
  push:
    branches: [main]
    paths:
      - "Docs/Palfrey Docs/**"

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_vault_links.py
